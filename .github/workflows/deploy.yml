# =============================================================================
# Despliegue del frontend estático en GitHub Pages
#
# Independiente del workflow de mantenimiento, como exige el prompt §2.3.
# Requisito previo: Settings → Pages → Source = "GitHub Actions".
# =============================================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      # El commit mensual de repo-activity.yml no debe redesplegar nada.
      - 'maintenance/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; no se cancela una en curso.
#
# Esto serializa las EJECUCIONES del workflow, pero no los despliegues de
# Pages: GitHub finaliza el despliegue de forma asíncrona, después de que la
# ejecución termine en verde. Si se lanza a mano un despliegue sobre un commit
# que ya se está publicando por su propio push, se crean dos despliegues del
# mismo sha y el segundo falla con
# «Deployment request failed ... due to in progress deployment».
# No es un error del proyecto y no afecta al sitio publicado: basta con
# relanzar el workflow. Para evitarlo, no uses `workflow_dispatch` sobre un
# commit que acabas de empujar; espera a que su propia ejecución termine.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22, no 20. `@supabase/realtime-js` exige WebSocket NATIVO: con Node
      # 20 la tanda de pruebas murió entera con «native WebSocket not found» en
      # cuanto un fichero de pruebas importó, de rebote, `lib/supabase`. En local
      # pasaba (Node 24 sí lo trae), y ese desfase es el problema de fondo: una
      # comprobación local que es más débil que la de Actions no comprueba nada.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Comprobaciones de calidad
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --run
          ./scripts/check-pure-tests.sh
          ./scripts/check-text-wrap.sh
          ./scripts/check-shell-quoting.sh

      - name: Comprobar las pistas de los embeds de PostgREST
        # Entre dos tablas unidas por más de una clave ajena, un embed sin
        # pista explícita devuelve HTTP 300 PGRST201 y deja la pantalla
        # entera sin datos. Ya ocurrió con work_members y con tasks, las dos
        # hacia profiles. Peor: con la pista equivocada la consulta funciona
        # pero devuelve a la persona equivocada, sin error visible.
        run: ./scripts/check-embeds.sh

      - name: Build
        env:
          # La clave anon es pública por diseño y acaba en el bundle: es
          # correcto. La seguridad real la impone RLS en PostgreSQL.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Para https://<usuario>.github.io/ThesisManager/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Comprobar que sigue siendo instalable
        # Cuando esto se rompe no se nota: un icono que da 404 no produce
        # ningún error, el navegador pone el suyo genérico y la aplicación «se
        # instala igual». Se comprueba sobre dist/, que es lo que se publica.
        run: ./scripts/check-pwa.sh dist

      - name: GitHub Pages necesita 404.html para las rutas profundas
        # Pages sirve 404.html conservando la URL solicitada; al ser una copia
        # de index.html, React Router resuelve la ruta en el cliente.
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Verificar que no se publica ningún secreto privilegiado
        # Decodifica los JWT encontrados en dist/ y aborta si alguno tiene rol
        # privilegiado. No basta con un grep: la propia librería de Supabase
        # contiene la cadena "sb_secret_" y daría un falso positivo, y el rol
        # de un JWT no es legible sin decodificar el payload.
        run: ./scripts/check-no-secrets.sh dist

      - uses: actions/configure-pages@v5
        with:
          # Habilita Pages si no lo está, para que el despliegue no dependa de
          # un paso manual en Settings. Sin esto, el primer despliegue de un
          # repositorio nuevo falla con «Get Pages site failed».
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
